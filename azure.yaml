# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: auto_ai_v0.0.2
metadata:
  template: auto_ai_v0.0.2

hooks:
    postprovision:
      posix:
        shell: sh
        run: azd env get-values > .env;
        interactive: true
        continueOnError: false
      windows:
        shell: pwsh
        run: $output = azd env get-values; Add-Content -Path .env -Value $output;
        interactive: true
        continueOnError: false

pipeline:
    variables:
        - AZURE_OPENAI_RESOURCE
        - AZURE_OPENAI_RESOURCE_GROUP
        - AZURE_OPENAI_RESOURCE_GROUP_LOCATION
        - AZURE_OPENAI_SKU_NAME
        - AZURE_OPENAI_API_VERSION
        - AZURE_OPENAI_DEPLOYMENT_1
        - AZURE_OPENAI_DEPLOYMENT_2
        - AZURE_OPENAI_API_KEY
        - GOOGLE_API_KEY
        - GOOGLE_CSE_ID
        - EMAIL_ADDRESS
        - AUTH_CLIENT_ID
        - AUTH_CLIENT_SECRET
        - AUTH_TENANT_ID
        - OPENAI_API_KEY
        - OPENAI_MODEL
        - TWILIO_ACCOUNT_SID
        - TWILIO_AUTH_TOKEN
        - TWILIO_FROM_PHONE_NUMBER
        - TEXT_TO_PHONE_NUMBER